name: Validate contributions
on:
  pull_request:
    paths: ["questions/**", "chats/**", "finetune/**", "scripts/**"]
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
